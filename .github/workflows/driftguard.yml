name: driftguardz

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Drift Analysis
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Run driftguard
        uses: alexnotgud-alt/driftguardz@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
